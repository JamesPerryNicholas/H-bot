# Open edition: no unlock code, and no bundled provider key. Users enter their own keys.
# Upgrade the existing H bot installation in place, keeping its shell identity,
# data at ~/.ds-bot and workspace at ~/DS Bot.
extends: ./electron-builder.yml
appId: io.github.fei2411.dsbot.local
productName: H bot
artifactName: H-bot-${version}-${os}-${arch}.${ext}
publish: null
extraMetadata:
  name: dsbot-dev
  productName: H bot
  description: H bot desktop app (open edition)
  dsBotBuild:
    automaticUpdates: false
    creditVariant: open
    defaultPlaces:
      dataName: .ds-bot
      workspaceName: DS Bot
    identity:
      appId: io.github.fei2411.dsbot.local
      inheritLegacy: false
      shellName: H bot
nsis:
  guid: 86bb7439-3260-4cce-b063-9f207f4e6a63
  deleteAppDataOnUninstall: false
