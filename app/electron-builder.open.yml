# Open edition: $20 credit unlocks on first launch, no code.
# Team history is shared with the unlock edition and the existing
# data at ~/.ds-bot (workspace: H bot). The install itself stays
# separate (appId, product name, shortcuts, Program Files).
extends: ./electron-builder.yml
appId: io.github.fei2411.dsbot.local.open
productName: H bot 开放版
artifactName: H-bot-${version}-开放版-${os}-${arch}.${ext}
publish: null
extraMetadata:
  name: dsbot-dev-open
  productName: H bot 开放版
  description: H bot desktop app (open edition)
  dsBotBuild:
    automaticUpdates: false
    creditVariant: open
    defaultPlaces:
      dataName: .ds-bot
      workspaceName: H bot
    identity:
      appId: io.github.fei2411.dsbot.local.open
      inheritLegacy: false
      shellName: H bot
